# Conda environment for ChromoPredict batch predictions
#   conda env create -f environment.yml
#   conda activate chromopredict
name: chromopredict
channels:
  - conda-forge
dependencies:
  - python=3.10
  - rdkit
  - numpy
  - pandas
  - matplotlib
  - openpyxl
  - pillow
  - seaborn
  - scikit-learn
  - jupyterlab
  - pip
